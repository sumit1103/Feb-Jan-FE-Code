<!DOCTYPE html>
<html lang="en">
<head>
    <title>Span Table</title>
</head>
<body>

<table border="1" style="width: 50%; border-collapse: collapse;">

    <!-- Top row -->
    <tr>
        <td colspan="4">1</td>
    </tr>

    <!-- Middle rows -->
    <tr>
        <td rowspan="2">1</td>
        <td>2</td>
        <td>3</td>
        <td rowspan="2">4</td>
    </tr>
    <tr>
        <td>2</td>
        <td>3</td>
    </tr>

    <!-- Bottom row -->
    <tr>
        <td colspan="4">1</td>
    </tr>

</table>

</body>
</html>
