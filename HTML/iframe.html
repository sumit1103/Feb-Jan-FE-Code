<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Iframe</title>
</head>
<body>

    <h1>Flipkart Website</h1>

    <iframe

        width="100%" 
        height="600px" 
        style="border:none;">

</html>
