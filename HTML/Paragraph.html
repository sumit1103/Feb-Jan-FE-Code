
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph</title>

</head>
<body>
    <!--case 1 -->
    <p>Hi</p>
    <p>Hello</p>
    <!--case 2 -->
    <p>Hi</p><p>Hello</p>
    <!--case 3 -->  
    <p> hi hello !</p>
    <!--case 4 -->
    <p> hi <br>
                hello !</p>
    <!--preformatted text -->
    <p> hi <pre>
        hello !</pre></p> 
    

</body>
</html>
