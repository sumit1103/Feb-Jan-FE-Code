<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dry Food Delight</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f8f5f2;
}

header {
    background: linear-gradient(to right, #d9a066, #b87333);
    text-align: center;
    padding: 20px;
    color: white;
}

nav a {
    margin: 0 15px;
    color: white;
    text-decoration: none;
}

.container {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 30px;
    flex-wrap: wrap;
}

.card {
    background: white;
    width: 200px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.card img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 10px;
}

footer {
    text-align: center;
    padding: 10px;
    background: #b87333;
    color: white;
}
</style>

</head>
<body>

<header>
<h1>🥜 Dry Food Delight 🍪</h1>
<nav>
<a href="#">Home</a>
<a href="#">Items</a>
<a href="#">Offers</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="container">

<div class="card">
<img src="almonds.jpg" alt="Almonds">
<h3>Almond Crunch</h3>
<p>Price: $10</p>
</div>

<div class="card">
<img src="cashew.jpg" alt="Cashews">
<h3>Cashew Delight</h3>
<p>Price: $12</p>
</div>

<div class="card">
<img src="mixed.jpg" alt="Mixed Nuts">
<h3>Mixed Nuts</h3>
<p>Price: $15</p>
</div>

</section>

<footer>
<p>© 2026 Dry Food Delight</p>
</footer>

</body>
</html>
